<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#5d5d5d" />
    <title>Reconnect | CivicBridge</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f9f9f9;
        color: #212121;
        font:
          16px/1.7 "Aptos",
          "Nirmala UI",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 450px;
        width: 100%;
        padding: 28px;
      }
      img {
        border-radius: 13px;
      }
      h1 {
        font-size: 30px;
        line-height: 1.3;
        letter-spacing: -0.7px;
        overflow-wrap: anywhere;
      }
      p,
      small {
        color: #6f6f6f;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        background: #5d5d5d;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      small {
        display: block;
        font-size: 12px;
        margin-top: 24px;
      }
      select {
        float: right;
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 7px;
        padding: 9px;
        color: #323232;
        max-width: 130px;
      }
    </style>
  </head>
  <body>
    <main>
      <select id="locale" aria-label="Choose language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="mr">मराठी</option>
        <option value="bn">বাংলা</option>
        <option value="ta">தமிழ்</option>
        <option value="te">తెలుగు</option></select
      ><img src="/icons/app-192.png" width="55" height="55" alt="CivicBridge" />
      <h1 id="heading">Your community will be here when you reconnect.</h1>
      <p id="copy">Connect to the internet to view posts or submit a problem or solution.</p>
      <p id="notice">Nothing has been queued or submitted.</p>
      <a href="/app" id="retry">Try again</a
      ><small id="privacy"
        >Private posts and account pages are never stored in the offline cache.</small
      >
    </main>
    <script>
      const messages = {
        en: [
          "Your community will be here when you reconnect.",
          "Connect to the internet to view posts or submit a problem or solution.",
          "Nothing has been queued or submitted.",
          "Try again",
          "Private posts and account pages are never stored in the offline cache.",
        ],
        hi: [
          "फिर जुड़ें, आपका समुदाय यहीं है।",
          "पोस्ट देखने या समस्या और समाधान भेजने के लिए इंटरनेट से जुड़ें।",
          "कोई पोस्ट कतार में नहीं है और कुछ भेजा नहीं गया है।",
          "फिर कोशिश करें",
          "निजी पोस्ट और खाते के पेज ऑफ़लाइन कैश में नहीं रखे जाते।",
        ],
        mr: [
          "पुन्हा जोडा, तुमचा समुदाय येथेच आहे.",
          "पोस्ट पाहण्यासाठी किंवा समस्या व उपाय पाठवण्यासाठी इंटरनेट जोडा.",
          "कोणतीही पोस्ट रांगेत नाही किंवा पाठवलेली नाही.",
          "पुन्हा प्रयत्न करा",
          "खाजगी पोस्ट व खात्याची पाने ऑफलाइन कॅशमध्ये ठेवली जात नाहीत.",
        ],
        bn: [
          "আবার সংযোগ হলে আপনার কমিউনিটি এখানেই থাকবে।",
          "পোস্ট দেখতে বা সমস্যা ও সমাধান জমা দিতে ইন্টারনেটে সংযোগ করুন।",
          "কোনো পোস্ট অপেক্ষায় রাখা বা জমা দেওয়া হয়নি।",
          "আবার চেষ্টা করুন",
          "ব্যক্তিগত পোস্ট ও অ্যাকাউন্টের পাতা অফলাইন ক্যাশে রাখা হয় না।",
        ],
        ta: [
          "மீண்டும் இணையும்போது உங்கள் சமூகம் இங்கே இருக்கும்.",
          "பதிவுகளைக் காண அல்லது பிரச்சினை, தீர்வைச் சமர்ப்பிக்க இணையுங்கள்.",
          "எந்தப் பதிவும் வரிசையில் வைக்கவோ சமர்ப்பிக்கவோ இல்லை.",
          "மீண்டும் முயல்க",
          "தனிப்பட்ட பதிவுகளும் கணக்குப் பக்கங்களும் ஆஃப்லைன் சேமிப்பில் வைக்கப்படுவதில்லை.",
        ],
        te: [
          "తిరిగి కనెక్ట్ అయినప్పుడు మీ కమ్యూనిటీ ఇక్కడే ఉంటుంది.",
          "పోస్టులు చూడడానికి లేదా సమస్య, పరిష్కారం సమర్పించడానికి ఇంటర్నెట్‌కు కనెక్ట్ అవ్వండి.",
          "పోస్టులు క్యూలో లేవు, ఏవీ సమర్పించబడలేదు.",
          "మళ్లీ ప్రయత్నించండి",
          "వ్యక్తిగత పోస్టులు, ఖాతా పేజీలు ఆఫ్‌లైన్ కాష్‌లో ఉంచబడవు.",
        ],
      };
      const picker = document.getElementById("locale"),
        saved = (
          document.cookie.split("; ").find((c) => c.startsWith("civicbridge_locale=")) || ""
        ).split("=")[1];
      function render(lang) {
        const key = Object.hasOwn(messages, lang) ? lang : "en";
        document.documentElement.lang = key + "-IN";
        ["heading", "copy", "notice", "retry", "privacy"].forEach(
          (id, i) => (document.getElementById(id).textContent = messages[key][i]),
        );
        picker.value = key;
      }
      render(saved);
      picker.addEventListener("change", () => {
        render(picker.value);
        document.cookie =
          "civicbridge_locale=" +
          picker.value +
          "; Path=/; Max-Age=31536000; SameSite=Lax" +
          (location.protocol === "https:" ? "; Secure" : "");
      });
    </script>
  </body>
</html>
