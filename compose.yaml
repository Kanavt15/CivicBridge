services:
  db:
    image: mongo:8.2
    command:
      [
        "mongod",
        "--replSet",
        "civicbridge-rs",
        "--bind_ip_all",
        "--port",
        "27018",
        "--oplogSize",
        "128",
      ]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - civicbridge_mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27018 --quiet --eval
          'try { if (!db.hello().isWritablePrimary) { rs.status(); quit(1); } } catch (e) { rs.initiate({_id:"civicbridge-rs",members:[{_id:0,host:"127.0.0.1:27018"}]}); quit(1); }'
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  civicbridge_mongo:
