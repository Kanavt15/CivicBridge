name: CivicBridge checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: mongodb://127.0.0.1:27018/civicbridge_ci?replicaSet=civicbridge-rs
      AUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: civicbridge-ci-only-ephemeral-secret-not-for-production
      DEMO_PASSWORD: CivicBridge@Test2026
      ALLOW_DEMO_ACCOUNTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev
      - run: npm audit --audit-level=high
      - name: Start isolated transaction-capable MongoDB
        run: |
          docker run -d --name civicbridge-mongo -p 127.0.0.1:27018:27018 mongo:8.2 --replSet civicbridge-rs --bind_ip_all --port 27018
          for attempt in $(seq 1 30); do
            if docker exec civicbridge-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec civicbridge-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"civicbridge-rs",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec civicbridge-mongo mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run ai:prepare
      - run: npm run ai:train
      - run: npm run ai:train -- --dataset data/civic-demo.json --output src/lib/ai/generated/demo-model.json
      - run: npm run etl:check
      - run: git diff --exit-code -- data/nyc311-civic.json src/lib/ai/generated/
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - name: Verify optimized production server
        run: npm run test:e2e
        env:
          E2E_SERVER_MODE: production
      - name: Install Chromium for user-app checks
        run: npx playwright install --with-deps chromium
      - name: Verify installable user app in a browser
        run: npm run test:app
      - run: npm run format:check
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image without secrets
        run: docker build --tag civicbridge:ci .
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_API_URL: https://civicbridge.example.test
      EXPO_PUBLIC_LOCAL_PREVIEW: "false"
      DATABASE_URL: mongodb://127.0.0.1:27018/civicbridge_ci_sync?replicaSet=civicbridge-rs
      AUTH_URL: http://127.0.0.1:3000
      AUTH_SECRET: civicbridge-sync-ci-only-ephemeral-secret
      ALLOW_DEMO_ACCOUNTS: "true"
      DEMO_PASSWORD: CivicBridge@Test2026
      CIVICBRIDGE_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci --include=dev
      - run: npm ci --prefix mobile
      - run: npm run mobile:check
      - run: npx expo-doctor
        working-directory: mobile
      - run: npm run export:native --prefix mobile
      - run: npm run export:web --prefix mobile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:native:ui
      - name: Start isolated MongoDB for cross-client synchronization
        run: |
          docker run -d --name civicbridge-sync-mongo -p 127.0.0.1:27018:27018 mongo:8.2 --replSet civicbridge-rs --bind_ip_all --port 27018
          for attempt in $(seq 1 30); do
            if docker exec civicbridge-sync-mongo mongosh --port 27018 --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec civicbridge-sync-mongo mongosh --port 27018 --quiet --eval 'rs.initiate({_id:"civicbridge-rs",members:[{_id:0,host:"127.0.0.1:27018"}]})'
          for attempt in $(seq 1 30); do
            if docker exec civicbridge-sync-mongo mongosh --port 27018 --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run db:seed
      - run: npm run build
      - name: Verify shared native and website records against the real API
        run: |
          npm run start > /tmp/civicbridge-sync-server.log 2>&1 &
          sync_server_pid=$!
          trap 'kill "$sync_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:3000 npm run test:sync
